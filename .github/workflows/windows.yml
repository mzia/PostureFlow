name: Windows 11 CI & Build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'windows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'windows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows.yml'

jobs:
  build-windows:
    name: Build & Verify on Windows 11
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check All Windows Targets
        run: cargo check --target x86_64-pc-windows-msvc --all-targets

      - name: Run Tests
        run: cargo test

      - name: Build Release Binaries
        run: cargo build --release --bin postureflow-gui --bin postureflow-daemon

      - name: Create Windows Install Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/windows-x64 -Force | Out-Null
          Copy-Item target/release/postureflow-gui.exe dist/windows-x64/
          Copy-Item target/release/postureflow-daemon.exe dist/windows-x64/
          Copy-Item windows/install.ps1 dist/windows-x64/
          Copy-Item windows/uninstall.ps1 dist/windows-x64/
          Copy-Item windows/resources/PostureFlow.manifest dist/windows-x64/
          Copy-Item windows/README.md dist/windows-x64/
          Compress-Archive -Path dist/windows-x64/* -DestinationPath dist/postureflow_1.0.1_windows_x64.zip -Force

      - name: Build Windows MSI Installer
        shell: pwsh
        run: |
          $candle = $null
          $light = $null
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            $candle = "candle.exe"
            $light = "light.exe"
          } elseif (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe") {
            $candle = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe"
            $light = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\light.exe"
          } elseif (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin\candle.exe") {
            $candle = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin\candle.exe"
            $light = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin\light.exe"
          }

          if ($candle -and $light) {
            Write-Host "==> Compiling MSI installer with WiX..." -ForegroundColor Cyan
            & $candle windows/installer/PostureFlow.wxs -out target/PostureFlow.wixobj
            & $light target/PostureFlow.wixobj -out dist/PostureFlow-1.0.1-x64.msi -ext WixUIExtension
            Write-Host "==> MSI successfully generated at dist/PostureFlow-1.0.1-x64.msi" -ForegroundColor Green
          } else {
            Write-Warning "WiX Toolset not found. Skipping MSI build."
          }

      - name: Upload Windows Distribution Package
        uses: actions/upload-artifact@v4
        with:
          name: postureflow-windows-x64
          path: dist/postureflow_1.0.1_windows_x64.zip

      - name: Upload Windows MSI Installer
        uses: actions/upload-artifact@v4
        if: hashFiles('dist/PostureFlow-1.0.1-x64.msi') != ''
        with:
          name: postureflow-windows-msi
          path: dist/PostureFlow-1.0.1-x64.msi

