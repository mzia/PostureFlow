name: CI Safety & D-Bus Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ufw man-db dbus libdbus-1-dev libglib2.0-bin

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Shellcheck syntax
        run: |
          bash -n bin/pop-profile
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tests/test_safety.sh
          bash -n tests/test_dbus.sh

      - name: Run Anti-Lockout Test Suite
        run: |
          bash tests/test_safety.sh

      - name: Run Rust Unit Tests
        run: |
          cargo test

      - name: Build Rust Release Binary
        run: |
          cargo build --release

      - name: Run D-Bus Integration Tests
        run: |
          bash tests/test_dbus.sh

      - name: Verify Man Page
        run: |
          man -l man/pop-profile.1 > /dev/null
