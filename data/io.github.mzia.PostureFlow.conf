<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow root to own the service names -->
  <policy user="root">
    <allow own="io.github.mzia.PostureFlow"/>
    <allow send_destination="io.github.mzia.PostureFlow"/>
    <allow receive_sender="io.github.mzia.PostureFlow"/>
    <allow own="io.github.mzia.PopProfile"/>
    <allow send_destination="io.github.mzia.PopProfile"/>
    <allow receive_sender="io.github.mzia.PopProfile"/>
  </policy>

  <!-- Allow any user on the local system bus to communicate with the daemon -->
  <policy context="default">
    <allow send_destination="io.github.mzia.PostureFlow"/>
    <allow receive_sender="io.github.mzia.PostureFlow"/>
    <allow send_destination="io.github.mzia.PopProfile"/>
    <allow receive_sender="io.github.mzia.PopProfile"/>
  </policy>
</busconfig>
