<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3845"/>
      <stop offset="100%" stop-color="#141920"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48b9c7"/>
      <stop offset="100%" stop-color="#2a7b88"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faa732"/>
      <stop offset="100%" stop-color="#f05a28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#3d4e5f" stroke-width="2" filter="url(#shadow)"/>

  <!-- Outer Shield Outline -->
  <path d="M 64 24 L 94 36 C 94 66 82 88 64 100 C 46 88 34 66 34 36 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Inner Shield Fill -->
  <path d="M 64 30 L 88 40 C 88 64 78 82 64 92 C 50 82 40 64 40 40 Z" 
        fill="url(#shieldGrad)" opacity="0.2"/>

  <!-- Center Energy / Mode Lightning Bolt & Toggle -->
  <path d="M 67 38 L 51 64 L 63 64 L 59 88 L 77 60 L 65 60 Z" 
        fill="url(#accentGrad)" filter="url(#shadow)"/>

  <!-- Indicator Dots for Profiles (Home, Work, Dev, Travel) -->
  <circle cx="48" cy="98" r="3" fill="#48b9c7" opacity="0.9"/>
  <circle cx="58" cy="103" r="3" fill="#faa732" opacity="0.9"/>
  <circle cx="70" cy="103" r="3" fill="#48b9c7" opacity="0.9"/>
  <circle cx="80" cy="98" r="3" fill="#48b9c7" opacity="0.9"/>
</svg>
