app-id: io.github.mzia.PostureFlow
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: postureflow-gui

finish-args:
  # Graphical desktop integration (Wayland + X11 fallback + OpenGL/DRI)
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Host D-Bus communication with privileged system daemon (primary + compat)
  - --system-talk-name=io.github.mzia.PostureFlow
  - --system-talk-name=io.github.mzia.PopProfile

  # Desktop integration portals (file picker for TOML import/export, notifications)
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser

  # StatusNotifierItem & tray integration (if running applet or tray indicators)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-postureflow

  # Custom profile persistence in user's XDG config
  - --filesystem=xdg-config/postureflow:create
  - --filesystem=xdg-config/pop-profile:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/postureflow/cargo

modules:
  - name: postureflow
    buildsystem: simple
    build-commands:
      # Build GUI and applet binaries using the SDK's stable Rust compiler with vendored crates
      - cargo --offline build --release --bin postureflow-gui --bin postureflow-applet
      # Install binaries to Flatpak prefix /app/bin
      - install -Dm755 target/release/postureflow-gui /app/bin/postureflow-gui
      - install -Dm755 target/release/postureflow-applet /app/bin/postureflow-applet
      - ln -sf postureflow-gui /app/bin/pop-profile-gui
      - ln -sf postureflow-applet /app/bin/pop-profile-applet
      # Install desktop file, metainfo, and icons
      - install -Dm644 data/io.github.mzia.PostureFlow.desktop /app/share/applications/io.github.mzia.PostureFlow.desktop
      - install -Dm644 data/io.github.mzia.PostureFlow.metainfo.xml /app/share/metainfo/io.github.mzia.PostureFlow.metainfo.xml
      - install -Dm644 data/icons/io.github.mzia.PostureFlow.svg /app/share/icons/hicolor/scalable/apps/io.github.mzia.PostureFlow.svg
    sources:
      - type: dir
        path: .
      - cargo-sources.json
