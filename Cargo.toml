[package]
name = "postureflow"
version = "1.0.0"
edition = "2021"
authors = ["M. Zia"]
description = "PostureFlow: Context-aware security, developer, and lifestyle posture manager"
license = "MIT"
repository = "https://github.com/mzia/pop-profile-manager"

[lib]
name = "postureflow"
path = "src/lib.rs"

[[bin]]
name = "postureflow-daemon"
path = "src/main.rs"

[[bin]]
name = "postureflow-applet"
path = "src/bin/postureflow-applet.rs"

[[bin]]
name = "postureflow-gui"
path = "src/bin/postureflow-gui.rs"

[dependencies]
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
libc = "0.2"
toml = "0.8"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wayland", "wgpu"] }
rfd = "0.15"
